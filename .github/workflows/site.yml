# Publica a pasta site/ (política de privacidade e exclusão de conta) no GitHub Pages.
# Antes da primeira vez: Settings > Pages > Source: GitHub Actions.
name: Site (política de privacidade)

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Não publica enquanto faltar o e-mail de contato no texto.
      - name: Conferir marcadores pendentes
        run: |
          if grep -rn "\[E-MAIL DE CONTATO\]" site; then
            echo "Troque [E-MAIL DE CONTATO] pelo e-mail do projeto antes de publicar."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
