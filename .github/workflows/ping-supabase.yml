# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso. Este workflow faz uma
# consulta pequena ao banco duas vezes por semana para ele continuar ativo.
# Usa a chave anon (a mesma que vai no app): com as regras de acesso (RLS), a resposta vem vazia,
# mas a consulta chega ao Postgres e conta como uso.
name: Ping do Supabase

on:
  schedule:
    # Segunda e quinta, 9h no horário de Brasília (12h UTC).
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltam os segredos SUPABASE_URL e SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/activities?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Resposta do Supabase: $status"
          [ "$status" = "200" ]
