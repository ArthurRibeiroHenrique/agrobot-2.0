# Monta a imagem do backend e guarda no GitHub Container Registry (gratuito para repositório público).
# O Azure Container Apps baixa a imagem de lá; assim não é preciso pagar um registro no Azure.
name: Imagem do backend

on:
  push:
    branches: [master, feat/azure-deploy]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Testes
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agrobot-backend" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          # "latest" só na master; toda versão também ganha a tag do commit.
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ github.ref_name == 'master' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
